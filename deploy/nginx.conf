# ==============================================================================
# OPICOC V2 Nginx Reverse Proxy & Edge Caching Configuration
# Optimized for Hostinger VPS (Ubuntu / Debian)
# ==============================================================================

# Rate limiting zone (20 requests per second per IP with burst allowance)
limit_req_zone $binary_remote_addr zone=opicoc_zone:10m rate=20r/s;

# 1. HTTP Server - Redirect all plaintext traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name opicoc.cc www.opicoc.cc staging.opicoc.cc;

    # Let's Encrypt ACME challenge directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server - Primary Application Reverse Proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name opicoc.cc www.opicoc.cc;

    # SSL Certificates (Let's Encrypt / Hostinger SSL)
    ssl_certificate /etc/letsencrypt/live/opicoc.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/opicoc.cc/privkey.pem;

    # Hardened SSL Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/woff2 image/svg+xml;

    # Client body limit (for custom base reference image uploads)
    client_max_body_size 10M;

    # High-Performance Static Asset Edge Caching (Bypasses Node.js process)
    location /_next/static/ {
        alias /var/www/opicoc-v2/.next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /assets/ {
        alias /var/www/opicoc-v2/public/assets/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /favicon.ico {
        alias /var/www/opicoc-v2/public/favicon.ico;
        access_log off;
        expires 30d;
    }

    # Main Application Proxy (Next.js Standalone / Docker container on port 3000)
    location / {
        limit_req zone=opicoc_zone burst=30 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
